<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi Agent Server - Chat</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: #0f172a;
      --panel-hover: #1e293b;
      --border: #334155;
      --cyan: #00f2fe;
      --purple: #a855f7;
      --green: #10b981;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 15px; font-weight: 700; color: var(--cyan); letter-spacing: 0.5px; }
    .status-pill {
      background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

    /* Quick Action Chips */
    .chips-bar {
      padding: 10px 24px; background: rgba(15, 23, 42, 0.5); border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
    }
    .chip {
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { border-color: var(--cyan); color: var(--cyan); background: var(--panel-hover); }

    /* Chat Container */
    #chat-container {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto;
    }
    .message {
      max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; word-break: break-word;
    }
    .message.user {
      background: #1e293b; color: #fff; align-self: flex-end; border: 1px solid var(--border);
    }
    .message.assistant {
      background: var(--panel); color: var(--text); align-self: flex-start; border: 1px solid var(--border); border-left: 3px solid var(--cyan);
    }
    .message.assistant.rag { border-left-color: var(--purple); }
    .msg-header { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .payload-box {
      margin-top: 8px; background: #020617; border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px;
      font-family: 'Courier New', monospace; font-size: 11.5px; color: #cbd5e1; max-height: 150px; overflow-y: auto;
    }

    /* Input Bar */
    .input-wrapper {
      padding: 16px 24px; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto;
    }
    input {
      flex: 1; background: #020617; border: 1px solid var(--border); color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 13.5px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--cyan); }
    button {
      background: var(--cyan); color: #000; border: none; padding: 0 20px; border-radius: 8px;
      font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ MULTI AGENT SERVER</div>
    <div class="status-pill"><div class="status-dot"></div>Qwen3.5-4BQ (Ready)</div>
  </header>

  <div class="chips-bar">
    <div class="chip" onclick="sendPreset('Check my memory usage')">📊 Check RAM</div>
    <div class="chip" onclick="sendPreset('Check CPU stats')">💻 Check CPU</div>
    <div class="chip" onclick="sendPreset('Read workspace policy documents and generate a health report')">📑 Generate Health Report</div>
    <div class="chip" onclick="sendPreset('List running processes')">⚙️ List Processes</div>
    <div class="chip" onclick="sendPreset('What is current time')">🕒 Get Time</div>
  </div>

  <div id="chat-container">
    <div class="message assistant">
      <div class="msg-header">System Assistant</div>
      Hello! I am your local Multi Agent Server. Type a command or click a quick action chip above.
    </div>
  </div>

  <div class="input-wrapper">
    <input type="text" id="user-input" placeholder="Type a command (e.g. set brightness to 50)..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');

    function appendMessage(sender, text, payload = null, isRag = false) {
      const div = document.createElement('div');
      div.className = `message ${sender} ${isRag ? 'rag' : ''}`;
      
      const header = document.createElement('div');
      header.className = 'msg-header';
      header.textContent = sender === 'user' ? 'You' : 'Multi Agent Server';
      div.appendChild(header);

      const content = document.createElement('div');
      content.innerHTML = text.replace(/\n/g, '<br/>');
      div.appendChild(content);

      if (payload) {
        const payloadDiv = document.createElement('div');
        payloadDiv.className = 'payload-box';
        payloadDiv.innerHTML = `<pre>${JSON.stringify(payload, null, 2)}</pre>`;
        div.appendChild(payloadDiv);
      }

      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendPreset(text) {
      userInput.value = text;
      await sendMessage();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      // Typing indicator placeholder
      const loadingId = 'loading-' + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.id = loadingId;
      loadingDiv.innerHTML = `<div class="msg-header">System Assistant</div>Processing query locally...`;
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const res = await fetch('http://127.0.0.1:8000/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        
        const data = await res.json();
        document.getElementById(loadingId).remove();

        const isRag = text.toLowerCase().includes('report') || text.toLowerCase().includes('rag');
        const summary = data.summary || data.detail || JSON.stringify(data);
        appendMessage('assistant', summary, data.payload || data, isRag);

      } catch (err) {
        document.getElementById(loadingId).remove();
        appendMessage('assistant', `⚠️ Failed to connect to FastAPI backend: ${err.message}`);
      }
    }
  </script>
</body>
</html>
