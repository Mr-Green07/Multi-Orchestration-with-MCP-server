name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip install -e .

      - name: Lint
        run: uv run ruff check mcp_server agent

      - name: Type check
        run: uv run mypy mcp_server agent --ignore-missing-imports

      - name: Test suite
        # The full suite: server, tools, policy, audit, orchestrator loop, CLI.
        # No model or GPU is required - the planner is driven by scripted replies.
        run: uv run pytest -v tests

      - name: Doctor (non-blocking smoke test)
        run: uv run python -m agent doctor || true

      - name: Selftest (model-free acceptance checks)
        run: uv run python -m agent selftest
